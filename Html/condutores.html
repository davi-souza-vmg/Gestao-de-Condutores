<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Condutores</title>
<link rel="icon" type="image/jpeg" href="../Img/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy-950:#0a1930;
    --navy-900:#0f2544;
    --navy-800:#16335f;
    --navy-700:#1e4278;
    --amber:#f2a93b;
    --amber-soft:#fdf1dd;
    --green:#2bad7d;
    --green-soft:#e4f7ef;
    --red:#e5484d;
    --red-soft:#fde9ea;
    --slate-900:#1b2433;
    --slate-600:#5b6577;
    --slate-400:#93a0b3;
    --line:#e4e8f0;
    --bg:#f4f6fb;
    --card:#ffffff;
    --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--slate-900);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  /* ---------- topo / faixa de rodovia ---------- */
  .road{
    position:relative;
    background:linear-gradient(120deg,var(--navy-950),var(--navy-900) 55%,var(--navy-800));
    color:#fff;
    padding:34px 40px 30px;
    overflow:hidden;
  }
  .road::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:6px;
    background-image:repeating-linear-gradient(90deg,var(--amber) 0 34px, transparent 34px 60px);
    opacity:.9;
  }
  .road-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .road-title h1{font-family:var(--font-display);font-size:28px;margin:0 0 4px;letter-spacing:.2px;}
  .road-title p{margin:0;color:var(--slate-400);font-size:14px;}
  .road-title .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--amber);margin-bottom:8px;display:block;
  }
  .road-status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--slate-400);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(43,173,125,.2);}
  .dot.off{background:var(--slate-400);box-shadow:none;}
  .dot.err{background:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.2);}

  #filterFilial{
    background:var(--navy-800);
    color:#fff;
    border:1.5px solid rgba(255,255,255,.3);
    border-radius:9px;
    padding:8px 12px;
    font-size:13px;
    font-family:var(--font-body);
    cursor:pointer;
  }
  #filterFilial:hover{border-color:rgba(255,255,255,.55);}
  #filterFilial option{
    background:#ffffff;
    color:var(--slate-900);
  }
  .header-refresh{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);border-radius:9px;background:var(--navy-800);color:#fff;font-size:22px;line-height:1;cursor:pointer;transition:transform .25s,background .2s;}
  .header-refresh:hover{background:var(--navy-700);transform:rotate(35deg)}
  .header-refresh:disabled{opacity:.65;cursor:wait}
  @keyframes confPulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
  @keyframes confDots{0%,20%{content:""}40%{content:"."}60%{content:".."}80%,100%{content:"..."}}
  .conf-loading{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 6px 20px rgba(15,37,68,.06);margin:10px 0;}
  .conf-loading-orbit{width:34px;height:34px;flex:0 0 34px;border:3px solid rgba(43,173,125,.18);border-top-color:var(--green);border-right-color:var(--amber);border-radius:50%;animation:confSpin .8s linear infinite;}
  .conf-loading-title{font-size:12px;font-weight:800;color:var(--slate-900)}
  .conf-loading-sub{font-size:11px;color:var(--slate-600);margin-top:4px;line-height:1.45}
  .conf-loading-dots:after{content:"...";display:inline-block;width:16px;overflow:hidden;vertical-align:bottom;animation:confPulse 1s ease-in-out infinite;}

  /* ---------- skeleton loader ---------- */
  @keyframes shimmer{
    0%{background-position:-400px 0;}
